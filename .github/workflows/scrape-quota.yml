name: EV Quota Scraper

on:
  workflow_dispatch:     # cron-job.org에서 10분마다 트리거

# scrape.yml과 GitHub Pages 배포 충돌 방지
concurrency:
  group: scraper-pipeline
  cancel-in-progress: false  # 대기 후 실행

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ========================================
      # 1. 스크래퍼 리포 체크아웃
      # ========================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # 2. Node.js 환경 설정
      # ========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set Puppeteer Cache Directory
        run: echo "PUPPETEER_CACHE_DIR=$(pwd)/.cache/puppeteer" >> $GITHUB_ENV

      - name: Restore Node Modules and Puppeteer Cache
        id: cache-restore
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .cache/puppeteer
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (with Puppeteer fix)
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" != "true" ]; then
            echo "Cache miss. Installing all dependencies..."
            npm install
          else
            echo "Cache hit. Skipping npm install, checking Puppeteer..."
          fi
          npx puppeteer install

      - name: Save New Node Modules Cache
        uses: actions/cache@v4
        if: steps.cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            node_modules
            .cache/puppeteer
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # ========================================
      # 3. 스크래핑 실행
      # ========================================
      - name: Run quota scraper
        run: node src/scraper-quota.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quota-results
          path: data/quota.json

      # ========================================
      # 4. 데이터 검증
      # ========================================
      - name: Validate quota data
        id: validate
        run: |
          RESULT=$(node src/validate-data.js quota)
          echo "검증 결과: $RESULT"

          VALID=$(echo "$RESULT" | node -e "process.stdin.on('data',d=>{const r=JSON.parse(d);console.log(r.valid)})")

          if [ "$VALID" == "true" ]; then
            echo "valid=true" >> $GITHUB_OUTPUT
            echo "✅ 데이터 검증 통과"
          else
            echo "valid=false" >> $GITHUB_OUTPUT
            echo "❌ 데이터 검증 실패"
          fi

      # ========================================
      # 5. scraper repo 커밋 (검증 결과와 무관하게 항상 커밋)
      # ========================================
      - name: Commit and push to scraper repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/quota.json

          if ! git diff --quiet --staged; then
            echo "Data changes detected. Committing and pushing..."
            git commit -m "Update EV quota data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M:%S KST')"

            MAX_RETRIES=5
            RETRY_COUNT=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Push attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."

              if git push; then
                echo "✅ Push successful!"
                break
              else
                echo "⚠️ Push failed. Pulling latest changes..."
                RETRY_COUNT=$((RETRY_COUNT + 1))

                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  git pull --rebase origin main
                  WAIT_TIME=$((2 ** RETRY_COUNT))
                  echo "Waiting ${WAIT_TIME}s before retry..."
                  sleep $WAIT_TIME
                fi
              fi
            done

            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Failed to push after $MAX_RETRIES attempts"
              exit 1
            fi
          else
            echo "No data changes since last run. Skipping commit."
          fi

      # ========================================
      # 6. GitHub Pages 배포 (검증 통과 시에만)
      # ========================================
      - name: Setup Pages
        if: steps.validate.outputs.valid == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.validate.outputs.valid == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/

      - name: Deploy to GitHub Pages
        if: steps.validate.outputs.valid == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      # ========================================
      # 7. 결과 로그
      # ========================================
      - name: Log result
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${{ steps.validate.outputs.valid }}" == "true" ]; then
            echo "✅ Quota 스크래핑 + 검증 통과 + GitHub Pages 배포 완료"
          elif [ "${{ steps.validate.outputs.valid }}" == "false" ]; then
            echo "⚠️ Quota 스크래핑 완료, 검증 실패 → scraper repo만 커밋"
          else
            echo "❌ Quota 스크래핑 중 오류 발생"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
